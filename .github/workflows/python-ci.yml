name=.github/workflows/python-ci.yml url=https://github.com/paradox-rpm/Class_XI/blob/main/.github/workflows/python-ci.yml
name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test with pytest
      run: |
        pytest
      continue-on-error: true

  # AI-Powered: Security Scanning
  codeql-analysis:
    name: CodeQL Analysis (Security Scanning)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    - uses: github/codeql-action/init@v2
      with:
        languages: 'python'
    - uses: github/codeql-action/autobuild@v2
    - uses: github/codeql-action/analyze@v2

  # AI-Powered: Advanced Code Quality
  super-linter:
    name: Super-Linter (Code Quality)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    - uses: github/super-linter@v4
      env:
        DEFAULT_BRANCH: main
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

  # AI-Powered: Code Insights & Quality
  sonarcloud:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - run: |
        python -m pip install --upgrade pip pytest coverage
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - run: pytest --cov=. --cov-report=xml
      continue-on-error: true
    - uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      continue-on-error: true
